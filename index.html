<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#9adaff" />
    <meta
      name="description"
      content="WordBloc — build words, open worlds. A word-building game for kids."
    />
    <title>WordBloc</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd166'/%3E%3Ctext x='32' y='45' font-family='Trebuchet MS,sans-serif' font-size='36' font-weight='bold' text-anchor='middle' fill='%233a2a00'%3EW%3C/text%3E%3C/svg%3E"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #9adaff;
        font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        /* no text selection / OS drag on canvas during tile drags */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* Visible only if the game fails to boot — real errors go to console. */
      #boot-failure {
        display: none;
        position: fixed;
        inset: 0;
        padding: 24px;
        background: #fff;
        color: #21324a;
        font-size: 16px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow: auto;
        z-index: 10;
      }
      #boot-failure.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <pre id="boot-failure" role="alert"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
